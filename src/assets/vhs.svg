<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
 <defs><linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9a32"/><stop offset="1" stop-color="#f45a12"/></linearGradient><linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26343d"/><stop offset="1" stop-color="#101c24"/></linearGradient></defs>
 <!-- VHS shell proportions: 187 mm wide by 103 mm tall, before perspective depth. -->
 <g transform="rotate(-8 256 256)">
  <rect x="34" y="148" width="444" height="245" rx="12" fill="#8c300e"/>
  <rect x="34" y="134" width="444" height="245" rx="12" fill="url(#shell)" stroke="#ffb664" stroke-width="7"/>
  <!-- Full-width hinged tape guard and its seam. -->
  <path d="M48 139h416v30H48z" fill="#f36b1e"/>
  <path d="M52 146h408" stroke="#ffca7e" stroke-width="6" stroke-linecap="round"/>
  <path d="M42 171h428" stroke="#aa411b" stroke-width="5"/>
  <!-- Separate reel windows flank the tall center label, not one cassette slot. -->
  <g fill="url(#window)" stroke="#d74a11" stroke-width="6">
   <rect x="60" y="191" width="118" height="111" rx="9"/>
   <rect x="334" y="191" width="118" height="111" rx="9"/>
  </g>
  <g fill="#52616a"><circle cx="119" cy="246" r="47"/><circle cx="393" cy="246" r="47"/></g>
  <g fill="#e3e7de" stroke="#a7b5b7" stroke-width="4"><circle cx="119" cy="246" r="29"/><circle cx="393" cy="246" r="29"/></g>
  <g fill="#182832"><circle cx="119" cy="246" r="11"/><circle cx="393" cy="246" r="11"/></g>
  <g stroke="#182832" stroke-width="5" stroke-linecap="round"><path d="M119 226v6m0 28v6m-20-20h6m28 0h6M393 226v6m0 28v6m-20-20h6m28 0h6"/></g>
  <rect x="194" y="188" width="124" height="124" rx="5" fill="#fff2d5"/>
  <path d="M205 202h102" stroke="#f36b1e" stroke-width="9"/>
  <path d="M210 220h76m-76 13h59" stroke="#c45c2d" stroke-width="5" stroke-linecap="round"/>
  <!-- VHS wordmark is paths so all icon exports are independent of installed fonts. -->
  <path d="m217 270 7 19 7-19m10 0v19m15-19v19m-15-10h15m27-9h-15v9h15v10h-15" fill="none" stroke="#c45c2d" stroke-width="5" stroke-linejoin="round"/>
  <!-- Molded loading recess and squared-off corners distinguish the VHS shell. -->
  <path d="m87 337 20-14h298l20 14v24H87z" fill="#d74a11"/>
  <path d="M109 347h294" stroke="#f9913a" stroke-width="5"/>
  <g fill="#aa411b"><circle cx="57" cy="356" r="5"/><circle cx="455" cy="356" r="5"/></g>
  <g stroke="#ffb664" stroke-width="3"><path d="M52 314v20m9-20v20m-9-150v16m9-16v16M460 314v20m-9-20v20m9-150v16m-9-16v16"/></g>
 </g>
</svg>
